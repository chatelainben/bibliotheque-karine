<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4a6da7">
  <title>Bibliothèque de Karine</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <header>
    <h1>📚 Bibliothèque de Karine <small id="version">v4</small></h1>
    <p id="compteur">Chargement…</p>
    <p id="erreur-globale" class="invisible"></p>
  </header>

  <main>
    <input id="recherche" type="search" placeholder="Titre, auteur, ISBN…"
           autocomplete="off" autocapitalize="none">
    <div class="filtres">
      <select id="filtre-theme"><option value="">Tous les thèmes</option></select>
      <select id="filtre-niveau"><option value="">Tous les niveaux</option></select>
    </div>
    <ul id="liste"></ul>
    <p id="vide" hidden>Aucun livre ne correspond à cette recherche.</p>
  </main>

  <button id="btn-ajouter" onclick="ouvrirAjout()">➕ Ajouter</button>

  <!-- Fenêtre d'ajout : invisible par défaut grâce à la classe CSS "invisible" -->
  <div id="modale" class="invisible">
    <div class="modale-contenu" id="fond-modale">

      <div id="vue-scan" class="invisible">
        <h2>Scanner le code-barres</h2>
        <p id="etat-scan">Appuie sur "Démarrer la caméra" (autorise l'accès si demandé).</p>
        <button id="btn-demarrer-scan" class="principal" onclick="demarrerScanManuel()">📷 Démarrer la caméra</button>
        <div id="lecteur"></div>
        <button id="btn-stop-scan" class="invisible" onclick="arreterScan()">Arrêter la caméra</button>
        <p class="indication">Ou saisis un ISBN à la main :</p>
        <input id="isbn-manuel" inputmode="numeric" placeholder="Ex. 9782070584390">
        <button onclick="chercherISBNManuel()">OK</button>
      </div>

      <div id="vue-verdict" class="invisible">
        <div id="verdict"></div>
        <div class="boutons">
          <button onclick="afficherVue('scan')">↩️ Scanner un autre</button>
          <button class="fermer" onclick="fermerAjout()">✖ Fermer</button>
        </div>
      </div>

      <div id="vue-formulaire" class="invisible">
        <h2>Nouveau livre</h2>
        <label>Titre *<input id="f-titre"></label>
        <label>Auteur<input id="f-auteur"></label>
        <label>Éditeur<input id="f-editeur"></label>
        <label>ISBN<input id="f-isbn"></label>
        <label>Niveau
          <select id="f-niveau">
            <option value="Maternelle (album)">Maternelle (album)</option>
            <option value="Maternelle">Maternelle</option>
            <option value="Maternelle / Cycle 2">Maternelle / Cycle 2</option>
            <option value="Cycle 2-3 (primaire)">Cycle 2-3 (primaire)</option>
          </select>
        </label>
        <label>Thème<input id="f-theme" list="liste-themes"></label>
        <datalist id="liste-themes"></datalist>
        <label>Emplacement<input id="f-emplacement" placeholder="Ex. étagère salon, boîte 3"></label>
        <p id="erreur-ajout" class="invisible"></p>
        <div class="boutons">
          <button class="principal" onclick="enregistrerLivre()">💾 Enregistrer</button>
          <button onclick="afficherVue('scan')">↩️ Retour au scan</button>
          <button onclick="fermerAjout()">✖ Fermer</button>
        </div>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
